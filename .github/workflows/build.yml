name: build

# pull_request トリガは付けない。push: '**' が全ブランチをカバーしており、
# 同一リポジトリ内のブランチから PR を出すと同じコミットのビルドが 2 本走るため
# (CUDA ビルドで 1 本 40分弱)。push 由来の run が PR のチェックとして表示される。
# fork からの PR を受けるようになったら、その時点で pull_request を足す。
on:
  push:
    branches: ['**']
  workflow_dispatch:

# 同じ ref に連続で push したら、走っている古い run は捨てる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_IMAGE: llama-cpp-runpod:test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ubuntu-latest の空きは約14GB しかなく、CUDA devel + CUDA ビルドで
      # 簡単に足りなくなるため、先に使わないものを消しておく。
      - name: Free disk space
        run: |
          echo "::group::before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get purge -y -qq '^llvm-.*' '^mysql-.*' '^mongodb-.*' \
            azure-cli google-cloud-cli firefox powershell || true
          sudo apt-get autoremove -y -qq || true
          sudo apt-get clean
          docker image prune -af || true
          echo "::group::after"
          df -h /
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      # テストしてから push したいので、まずローカルの docker に load する。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Image size
        run: |
          SIZE=$(docker images --format '{{.Size}}' "$TEST_IMAGE")
          echo "image size: $SIZE"
          echo "image size: \`$SIZE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Test image
        run: IMAGE="$TEST_IMAGE" ./test/test-image.sh

      # push 用のビルドは buildx のキャッシュから再構成されるので、
      # ここで load したイメージを消してディスクを空けておく。
      - name: Reclaim disk space
        run: |
          docker rmi "$TEST_IMAGE" || true
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
